<!-- New-skip-trace modal. Returned by /api/skip-trace/new and rendered
     into #workflow-dialog via hx-target="#workflow-dialog". POSTs to
     /skip-trace/run; HX-Trigger: dashboard-refresh on the response
     re-renders the active + recent fragments and the modal closes
     itself. -->
<div class="modal-overlay" onclick="closeWorkflowDialog(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h3>New skip-trace</h3>
      <button type="button" class="btn btn-ghost btn-sm modal-close"
              onclick="closeWorkflowDialog()" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18" /><path d="M6 6l12 12" />
        </svg>
      </button>
    </div>
    <!-- hx-target=this hx-swap=none: don't try to swap any DOM. The
         server returns 200 with HX-Trigger: dashboard-refresh which
         fires hx-trigger="dashboard-refresh from:body" on the runs
         slot, and hx-on::after-request closes the modal. Targeting
         a removed element used to throw htmx:targetError silently. -->
    <!-- After submit: close modal AND fire one delayed refresh ~1.5s
         later so the runs table picks up the completed run. The
         immediate HX-Trigger refresh races the worker (skip-trace
         finishes in ~50ms but list_recent filters to terminal status),
         so we re-trigger to be sure. -->
    <form class="modal-body" hx-post="/skip-trace/run"
          hx-target="this" hx-swap="none"
          hx-on::after-request="closeWorkflowDialog(); setTimeout(function(){ if(window.htmx) window.htmx.trigger('body','dashboard-refresh'); }, 1500);">
      <label>
        <span>Subject name</span>
        <input class="input" type="text" name="name" placeholder="John Smith" required autofocus />
      </label>
      <label>
        <span>State</span>
        <select class="input" name="state">
          <option value="CA">California</option>
          <option value="TX">Texas</option>
          <option value="OH">Ohio</option>
          <option value="NY">New York</option>
          <option value="PA">Pennsylvania</option>
          <option value="FL">Florida</option>
        </select>
      </label>
      <label>
        <span>City (optional, enables specialized people-search sites)</span>
        <input class="input" type="text" name="city" placeholder="Stockton" />
      </label>
      <label>
        <span>Case # (optional)</span>
        <input class="input" type="text" name="case_number" placeholder="FCAR-1234" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn" onclick="closeWorkflowDialog()">Cancel</button>
        <button type="submit" class="btn btn-primary">Run trace</button>
      </div>
    </form>
  </div>
</div>
